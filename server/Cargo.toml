[package]
name = "linkedin-challenge-server"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "linkedin-challenge-server"

[[bin]]
name = "linkedin-challenge-server"
path = "src/main.rs"

# The Vercel function entry generated by create-nextrs-app.
[[bin]]
name = "index"
path = "api/index.rs"

[[bin]]
name = "linkedin-challenge-server-dump-openapi"
path = ".nextrs/dump-openapi.rs"

[build-dependencies]
nextrs = { git = "https://github.com/drewhirschi/nextrs.git", rev = "3ca0527", features = [
    "build",
    "tsx",
] }

[dependencies]
nextrs = { git = "https://github.com/drewhirschi/nextrs.git", rev = "3ca0527", features = [
    "vercel",
] }
# Two drivers, chosen at runtime by the DATABASE_URL scheme: `turso:` (a local file) for
# development, `postgres:` for deployment. Toasty's turso driver is local-file only — it cannot
# reach hosted Turso — and a file database on a serverless function loses writes silently, so
# production needs a real server. Keeping both means dev keeps its zero-setup file.
toasty = { version = "0.7", features = ["turso", "postgresql"] }
axum = "0.8"
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tower-livereload = "0.9"
vercel_runtime = { version = "2", features = ["axum"] }
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "5"
rand = "0.8"
argon2 = "0.5"

# Password hashing is deliberately slow, and unoptimized it is slower still: every e2e test server
# (debug build) hashes the seeded demo passwords at startup and on each sign-in. Optimizing just
# these crates in dev builds makes that ~10x faster without changing what they compute.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
